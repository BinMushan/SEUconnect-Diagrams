<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEUconnect Diagrams</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #243b64 0, transparent 45%),
        #101827;
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }

    .buttons {
      display: grid;
      gap: 16px;
    }

    a {
      display: block;
      padding: 16px 20px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    a:hover,
    a:focus-visible {
      background: #3b82f6;
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>SEUconnect Diagrams</h1>
    <div class="buttons">
      <a href="Diagrams/Architechture-Diagram.drawio.html">Architecture Diagram</a>
      <a href="Diagrams/ER-diagram.drawio.html">ER Diagram</a>
    </div>
  </main>
</body>
</html>
